kind = "web"
previewPath = "/"
title = "CC Tech Australia"
version = "1.0.0"
id = "artifacts/cctech-australia"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24756

[services.development]
run = "pnpm --filter @workspace/cctech-australia run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cctech-australia", "run", "build" ]
publicDir = "artifacts/cctech-australia/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24756"
BASE_PATH = "/"
